<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f5132">
<title>Quiniela del grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1b1f1c;--muted:#5b645e;--line:#e2e6e1;--brand:#0f5132;--brand2:#198754;
--ok:#157347;--okbg:#e5f4ea;--bad:#b02a37;--badbg:#fbe9eb;--warn:#8a5a00;--warnbg:#fff4d6;--chip:#eef1ed;}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;letter-spacing:.01em}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 48px}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0f5132,#198754)}
.lcard{background:#fff;border-radius:22px;padding:28px 22px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.lcard .logo{font-size:2.6rem;text-align:center}
.lcard h1{text-align:center;font-size:1.6rem;margin:6px 0 4px}
.lcard p.sub{text-align:center;color:var(--muted);margin:0 0 20px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.t{width:100%;font:inherit;font-size:1.1rem;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fafbfa}
input.t:focus{outline:none;border-color:var(--brand2);background:#fff}
.rem{display:flex;gap:10px;align-items:center;margin:16px 0 4px;font-size:1rem}
.rem input{width:22px;height:22px;accent-color:var(--brand2)}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--brand2);color:#fff;font-weight:700;font-size:1.15rem}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-weight:700;margin-top:12px;min-height:1.5em;text-align:center}
/* app */
header.top{background:var(--brand);color:#fff;padding:16px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toprow h1{font-size:1.3rem}
.upd{font-size:.8rem;opacity:.85}
.out{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:.85rem}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;background:transparent;color:#d8eadf;border:0;border-bottom:4px solid transparent;padding:10px 4px 12px;font-weight:700;font-size:1.05rem}
.tab.on{color:#fff;border-bottom-color:#9be7b9}
.card{background:var(--card);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
.hero h2{font-size:2rem}
.state{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.9rem;margin-top:8px}
.s-por_empezar{background:var(--chip);color:var(--muted)}
.s-en_juego{background:var(--warnbg);color:var(--warn)}
.s-terminada,.s-escrutada{background:var(--okbg);color:var(--ok)}
.meta{color:var(--muted);margin-top:8px;font-size:.95rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--chip);border-radius:14px;padding:12px}
.stat .k{font-size:.85rem;color:var(--muted);font-weight:700}
.stat .v{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:2px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:400}
.stat.wide{grid-column:1/-1}
.prize-yes{background:var(--okbg)} .prize-yes .v{color:var(--ok)}
.bars{margin-top:10px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.95rem}
.bar .l{width:92px;flex:none}
.bar .track{flex:1;height:14px;background:#e6ebe6;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand2);border-radius:8px}
.bar .p{width:52px;text-align:right;font-weight:700;flex:none}
.sec{font-size:1.15rem;margin:22px 4px 6px;color:var(--brand)}
.m{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m.hit{background:var(--okbg)} .m.miss{background:var(--badbg)}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.teams{flex:1;min-width:0}
.teams .n{font-weight:700;font-size:1.05rem;word-wrap:break-word}
.teams .ko{font-size:.85rem;color:var(--muted)}
.teams .res{font-size:1rem;margin-top:2px}
.pick{flex:none;min-width:58px;text-align:center;font-weight:700;font-size:1.35rem;padding:6px 8px;border-radius:12px;background:#fff;border:2px solid var(--brand2);color:var(--brand)}
.pick.dbl{background:var(--brand2);color:#fff}
.mark{flex:none;width:30px;text-align:center;font-size:1.4rem}
.list{padding:0;overflow:hidden}
.pleno{border-top:3px solid var(--line)}
.pend{background:var(--warnbg);border-color:#f1d78a}
.pend h2{font-size:1.5rem}
.pend .big{font-size:1.3rem;font-weight:700;color:var(--warn);margin-top:8px}
.note{font-size:.9rem;color:var(--muted);margin:10px 4px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{margin-top:14px;padding:0;overflow:hidden}
.hist summary{list-style:none;padding:16px 18px;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hrow h3{font-size:1.3rem}
.hgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.95rem}
.pill.ok{background:var(--okbg);color:var(--ok);font-weight:700}
.pill.bad{background:var(--badbg);color:var(--bad)}
.open{color:var(--brand2);font-weight:700;margin-top:10px;font-size:.95rem}
details[open] .open .c{display:none} details:not([open]) .open .o{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.hidden{display:none!important}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:10px 4px}
.legend span b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
</style>
</head>
<body>
<div id="login">
  <form class="lcard" id="lform" autocomplete="on">
    <div class="logo">⚽</div>
    <h1>Quiniela del grupo</h1>
    <p class="sub">Entra con el usuario y la contraseña del grupo</p>
    <label class="f" for="u">Usuario</label>
    <input class="t" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="f" for="p">Contraseña</label>
    <input class="t" id="p" name="password" type="password" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="r" checked> Recordarme en este móvil</label>
    <button class="btn" id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top"><div class="wrap" style="padding-bottom:0">
    <div class="toprow"><div><h1>⚽ Quiniela del grupo</h1><div class="upd" id="upd"></div></div>
      <button class="out" id="logout">Salir</button></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-t="cur" role="tab">Jornada actual</button>
      <button class="tab" data-t="his" role="tab">Historial</button>
    </div>
  </div></header>
  <main class="wrap">
    <section id="cur"></section>
    <section id="his" class="hidden"></section>
  </main>
</div>

<script>
(function(){
const KEY_STORE='quiniela_k1', ITER_FALLBACK=600000;
const $=id=>document.getElementById(id);
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let blob=null;

async function loadBlob(){
  const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo cargar');
  return r.json();
}
async function derive(user,pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+'\n'+pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function dec(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv),additionalData:new TextEncoder().encode(blob.aad)},key,b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryStored(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY_STORE)||'null');
    if(!s||s.salt!==blob.salt) return null;
    const key=await crypto.subtle.importKey('raw',b64d(s.k),{name:'AES-GCM'},false,['decrypt']);
    return await dec(key);
  }catch(e){return null}
}
$('lform').addEventListener('submit',async e=>{
  e.preventDefault();
  const go=$('go'); go.disabled=true; go.textContent='Abriendo…'; $('err').textContent='';
  try{
    if(!blob) blob=await loadBlob();
    const key=await derive($('u').value.trim().toLowerCase(),$('p').value,b64d(blob.salt),blob.iter||ITER_FALLBACK);
    let data;
    try{ data=await dec(key);}catch(x){ throw new Error('bad'); }
    if($('r').checked){ localStorage.setItem(KEY_STORE,JSON.stringify({salt:blob.salt,k:b64e(await crypto.subtle.exportKey('raw',key))})); }
    show(data);
  }catch(x){
    $('err').textContent = x.message==='bad' ? 'Usuario o contraseña incorrectos' : 'No se pudo abrir. Revisa tu conexión.';
  }finally{ go.disabled=false; go.textContent='Entrar'; }
});
$('logout').addEventListener('click',()=>{localStorage.removeItem(KEY_STORE);location.reload();});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('cur').classList.toggle('hidden',t.dataset.t!=='cur');
  $('his').classList.toggle('hidden',t.dataset.t!=='his');
  window.scrollTo(0,0);
}));

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=v=>(v==null?'—':v.toLocaleString('es-ES',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €');
const pct=v=>Math.round(v*100)+'%';
const STATE={por_empezar:'Por empezar',en_juego:'En juego',terminada:'Terminada · falta escrutinio',escrutada:'Terminada'};
const catTxt=c=>Object.entries(c||{}).map(([k,n])=>(n>1?n+' × ':'')+k).join(', ');

function matchRow(m){
  const cls=m.hit===true?'hit':m.hit===false?'miss':'';
  const mark=m.hit===true?'✅':m.hit===false?'❌':'';
  const isP=m.n===15;
  let res='';
  if(m.score) res='Resultado: <b>'+esc(m.score)+'</b>';
  else if(m.live) res='🔴 '+esc(m.live.status)+(m.live.score?' · <b>'+esc(m.live.score)+'</b>':'');
  const dbl=!isP&&m.pick.length>1;
  return `<div class="m ${cls} ${isP?'pleno':''}"><div class="num">${isP?'P15':m.n}</div>
    <div class="teams"><div class="n">${esc(m.name)}</div>
    <div class="ko">${isP?'Pleno al 15 · ':''}${esc(m.kickoff)}</div>
    ${res?'<div class="res">'+res+'</div>':''}</div>
    <div class="pick ${dbl?'dbl':''}">${esc(m.pick)}</div><div class="mark">${mark}</div></div>`;
}
function ticketBlock(j){
  return `<div class="card list">${j.matches.map(matchRow).join('')}</div>
  <div class="legend"><span><b style="background:var(--brand2)"></b>Doble</span><span><b style="background:#fff;border:2px solid var(--brand2)"></b>Fijo</span><span>✅ acierto · ❌ fallo</span></div>
  <p class="note">Horas en hora UK. ${eur(j.cost)} · ${j.ncols} columnas (reducción de 7 dobles). Gana la mejor de las ${j.ncols} columnas.</p>`;
}
function prizeStat(j){
  if(j.prize_known) return Object.keys(j.categories||{}).length
    ? `<div class="stat wide prize-yes"><div class="k">Premio</div><div class="v">${eur(j.prize_eur)}</div><div>${esc(catTxt(j.categories))}</div></div>`
    : `<div class="stat wide"><div class="k">Premio</div><div class="v">Sin premio</div></div>`;
  if(Object.keys(j.categories||{}).length) return `<div class="stat wide prize-yes"><div class="k">Premio asegurado</div><div class="v" style="font-size:1.25rem">${esc(catTxt(j.categories))}</div><div class="meta" style="margin:0">Importe cuando salga el escrutinio</div></div>`;
  return '';
}
function probBlock(j){
  if(!j.pdist) return '';
  const rows=[14,13,12,11,10].map(k=>`<div class="bar"><span class="l">${k} aciertos</span><span class="track"><span class="fill" style="width:${Math.max(1,j.pdist[k]*100)}%"></span></span><span class="p">${j.pdist[k]<0.005?'<1%':pct(j.pdist[k])}</span></div>`).join('');
  return `<div class="card"><h3>Probabilidad de premio: ${pct(j.pdist.any)}</h3>
  <p class="meta" style="margin-top:4px">Con lo que falta por jugar, según las cuotas.</p><div class="bars">${rows}</div></div>`;
}
function currentTicket(j){
  const first=j.first_kickoff?new Date(j.first_kickoff):null;
  const when=first?first.toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}):'';
  const played=j.played_n;
  return `<div class="card hero"><h2>Jornada ${j.jornada}</h2>
   <span class="state s-${j.state}">${STATE[j.state]||''}</span>
   ${j.state==='por_empezar'&&when?`<div class="meta">Primer partido: <b>${esc(when)}</b> (hora UK)</div>`:''}
   <div class="stats">
    <div class="stat"><div class="k">Partidos acertados</div><div class="v">${j.hits_mask}<small> de ${played} jugados</small></div></div>
    <div class="stat"><div class="k">Mejor columna</div><div class="v">${j.best_col}<small> de 14</small></div></div>
    ${prizeStat(j)}
    ${j.state!=='escrutada'&&j.state!=='terminada'?`<div class="stat wide"><div class="k">Máximo posible</div><div class="v">${j.max_possible}<small> aciertos</small></div></div>`:''}
   </div></div>
   ${probBlock(j)}
   <h3 class="sec">Nuestro boleto</h3>${ticketBlock(j)}`;
}
function pendingCard(p,small){
  return `<div class="card pend"><h2>Jornada ${p.jornada}</h2>
  <div class="big">Boleto pendiente</div>
  <div class="meta">La jugamos, pero el boleto aún no está hecho.${p.first_kickoff_txt?` Primer partido: <b>${esc(p.first_kickoff_txt)}</b> (hora UK).`:''}</div>
  ${!small&&p.matches&&p.matches.length?`<details style="margin-top:10px"><summary class="open" style="cursor:pointer">Ver los partidos</summary>
  <div style="margin-top:8px">${p.matches.map(m=>`<div style="padding:6px 0;border-bottom:1px solid #f1d78a"><b>${m.n===15?'P15':m.n}.</b> ${esc(m.name)} <span class="ko" style="color:var(--muted);font-size:.85rem">${esc(m.kickoff)}</span></div>`).join('')}</div></details>`:''}
  </div>`;
}
function show(d){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('upd').textContent='Actualizado: '+(d.updated||'');
  // current
  let h='';
  const c=d.current;
  if(!c) h='<div class="card empty">Todavía no hay jornadas.</div>';
  else if(c.type==='pending'){ const p=d.pending.find(x=>x.jornada===c.jornada&&x.temporada===c.temporada); h=pendingCard(p,false); }
  else{
    const j=d.jornadas.find(x=>x.id===c.id); h=currentTicket(j);
    const others=d.pending.filter(p=>!(c.type==='pending'&&p.jornada===c.jornada));
    if(others.length) h+='<h3 class="sec">Próxima</h3>'+others.map(p=>pendingCard(p,true)).join('');
  }
  $('cur').innerHTML=h;
  // history
  const t=d.totals;
  let hh=`<div class="card"><h3 style="margin-bottom:12px">Totales</h3><div class="tot">
   <div class="stat"><div class="k">Jornadas jugadas</div><div class="v">${t.n}</div></div>
   <div class="stat"><div class="k">Gastado</div><div class="v">${eur(t.spent)}</div></div>
   <div class="stat"><div class="k">Ganado</div><div class="v">${eur(t.won)}</div></div>
   <div class="stat ${t.balance>=0?'prize-yes':''}"><div class="k">Balance</div><div class="v">${(t.balance>0?'+':'')+eur(t.balance)}</div></div>
  </div></div>`;
  if(!d.jornadas.length) hh+='<div class="card empty">Aún no hay jornadas jugadas.</div>';
  d.jornadas.forEach(j=>{
    const live=j.state==='en_juego'||j.state==='por_empezar';
    const p15=j.pleno_hit===true?'<span class="pill ok">Pleno ✅</span>':j.pleno_hit===false?'<span class="pill bad">Pleno ❌</span>':'<span class="pill">Pleno: pendiente</span>';
    let prize;
    if(j.prize_known) prize=Object.keys(j.categories||{}).length?`<span class="pill ok">${esc(catTxt(j.categories))} · ${eur(j.prize_eur)}</span>`:'<span class="pill">Sin premio</span>';
    else if(Object.keys(j.categories||{}).length) prize=`<span class="pill ok">${esc(catTxt(j.categories))} · importe pendiente</span>`;
    else prize=`<span class="pill">${live?'En curso':'Sin premio'}</span>`;
    hh+=`<details class="card hist"><summary>
      <div class="hrow"><h3>Jornada ${j.jornada}</h3><span class="state s-${j.state}" style="margin:0">${STATE[j.state]}</span></div>
      <div class="hgrid"><span class="pill"><b>${j.best_col}</b> de ${live?j.played_n+' jugados':'14'}</span>${p15}${prize}<span class="pill">Coste ${eur(j.cost)}</span></div>
      <div class="open"><span class="c">Ver boleto y resultados ▾</span><span class="o">Ocultar ▴</span></div>
    </summary><div style="padding:0 12px 12px">${ticketBlock(j)}</div></details>`;
  });
  $('his').innerHTML=hh;
}
(async()=>{
  try{ blob=await loadBlob(); const d=await tryStored(); if(d) show(d);}catch(e){}
})();
})();
</script>
</body>
</html>
